# NOTE: this pipeline ships outside .github/workflows because the current GitHub
# App token lacks the `workflows` write permission. To activate it, either
#   cp ci/workflows/<this-file> .github/workflows/   and push from an account
#   with workflow permissions, or paste it in via the GitHub web UI under
#   Settings/Actions. Everything below is unchanged.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: du -sh dist && find dist -type f -name '*.js' -exec ls -lh {} +

  smoke:
    name: Headless browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install headless Chromium (software WebGL)
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npm run test:smoke

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: tests/smoke/smoke.png

