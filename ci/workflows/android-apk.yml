# NOTE: this pipeline ships outside .github/workflows because the current GitHub
# App token lacks the `workflows` write permission. To activate it, either
#   cp ci/workflows/<this-file> .github/workflows/   and push from an account
#   with workflow permissions, or paste it in via the GitHub web UI under
#   Settings/Actions. Everything below is unchanged.

name: Android APK

# Builds an installable .apk. This repo has no Android SDK available in the
# development sandbox, so CI is the canonical way to produce a binary.
#
# Trigger it with:  gh workflow run android-apk.yml
# or by pushing a tag like v1.0.0

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (shown in Android settings)'
        required: false
        default: '1.0'
      version_code:
        description: 'Version code (integer, must increase for Play uploads)'
        required: false
        default: '1'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Import release keystore (if configured)
        if: ${{ env.SF_KEYSTORE_BASE64 != '' }}
        env:
          SF_KEYSTORE_BASE64: ${{ secrets.SF_KEYSTORE_BASE64 }}
        run: |
          echo "$SF_KEYSTORE_BASE64" | base64 -d > android/starfall-release.keystore
          {
            echo "storeFile=starfall-release.keystore"
            echo "storePassword=${SF_STORE_PASSWORD}"
            echo "keyAlias=${SF_KEY_ALIAS}"
            echo "keyPassword=${SF_KEY_PASSWORD}"
          } > android/keystore.properties
        continue-on-error: true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/*.apk artifacts/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: starfall-vector-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
