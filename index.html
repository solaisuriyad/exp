<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04030f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Starfall Vector — a tilt-controlled 3D space shooter built with Three.js."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Starfall Vector</title>
    <style>
      html,
      body {
        margin: 0;
        background: #04030f;
        height: 100%;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64f5ff;
        font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="boot">LOADING</div>
      <div id="fatal">
        <div>
          <h2>STARTUP FAILED</h2>
          <p>Something went wrong.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', function () {
        var b = document.getElementById('boot');
        if (b) setTimeout(function () { b.remove(); }, 350);
      });
    </script>
  </body>
</html>
